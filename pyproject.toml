[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webhook-inspector"
version = "0.1.0"
description = "Local webhook receiver and debugger: stores every request in SQLite, verifies Stripe/GitHub/Shopify signatures, redacts secrets, replays on demand and exports to curl or pytest."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Marvin Palencia"}]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "jinja2>=3.1",
    "tomli>=2.0; python_version < '3.11'",
]
keywords = ["webhook", "stripe", "github", "shopify", "hmac", "debugger", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Internet :: WWW/HTTP",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
webhook-inspector = "webhook_inspector.cli:main"

[project.urls]
Author = "https://marvin.demarkstudio.ca"

[tool.setuptools]
packages = ["webhook_inspector"]

[tool.setuptools.package-data]
webhook_inspector = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
