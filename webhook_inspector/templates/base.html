<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{% block title %}webhook-inspector{% endblock %}</title>
<style>
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; color: #1d2330; background: #f6f7f9; }
  header { background: #1d2330; color: #fff; padding: 10px 20px; display: flex; gap: 16px; align-items: baseline; }
  header a { color: #fff; text-decoration: none; font-weight: 600; }
  header small { color: #a9b1c2; }
  main { padding: 16px 20px; max-width: 1200px; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #e3e6ec; vertical-align: top; }
  th { background: #eef0f4; font-weight: 600; }
  td.mono, pre, code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  td.num { text-align: right; }
  pre { background: #fff; border: 1px solid #e3e6ec; padding: 10px; overflow: auto; max-height: 600px; white-space: pre-wrap; word-break: break-all; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .verified { background: #d7f5df; color: #16622e; }
  .invalid { background: #fbdada; color: #8a1c1c; }
  .unsigned { background: #e6e8ee; color: #444c5c; }
  .no-secret { background: #fdf0c8; color: #6d5400; }
  .muted { color: #6b7385; }
  .error { background: #fbdada; color: #8a1c1c; padding: 8px 10px; }
  .box { background: #fff; border: 1px solid #e3e6ec; padding: 10px 12px; margin: 12px 0; }
  form.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=url] { width: 420px; max-width: 100%; padding: 4px 6px; }
  h2 { font-size: 16px; margin: 20px 0 8px; }
</style>
</head>
<body>
<header><a href="/">webhook-inspector</a><small>v{{ version }} - local webhook receiver and debugger</small></header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
